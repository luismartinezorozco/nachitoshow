<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NACHITO SHOW</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="https://www.image2url.com/r2/default/images/1776961997806-1a99717c-a912-4b5f-9d77-3b695d6741ba.jpg">

    <!-- Fuentes y Estilos -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Configuración de colores de la marca -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandRed: '#F03C31',   /* Rojo de la nariz y letras */
                        brandBlue: '#0B358F',  /* Azul de las gafas */
                        brandGreen: '#79C142', /* Verde de la S */
                        brandYellow: '#FFD100',/* Amarillo del arcoíris */
                    },
                    fontFamily: {
                        'playful': ['Fredoka', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            /* Fondo con un patrón sutil de puntos para darle un toque divertido */
            background-color: #EAF6FF;
            background-image: radial-gradient(#FFD100 2px, transparent 2px);
            background-size: 30px 30px;
        }

        /* Estilo tipo Cómic para los botones */
        .btn-comic {
            transition: all 0.2s ease-in-out;
        }
        .btn-comic:hover {
            transform: translate(2px, 2px);
        }
        
        /* Sombras específicas por color */
        .shadow-blue { box-shadow: 4px 4px 0px 0px #0B358F; }
        .btn-comic:hover.shadow-blue { box-shadow: 2px 2px 0px 0px #0B358F; }

        .shadow-green { box-shadow: 4px 4px 0px 0px #79C142; }
        .btn-comic:hover.shadow-green { box-shadow: 2px 2px 0px 0px #79C142; }

        .shadow-red { box-shadow: 4px 4px 0px 0px #F03C31; }
        .btn-comic:hover.shadow-red { box-shadow: 2px 2px 0px 0px #F03C31; }

        .shadow-black { box-shadow: 4px 4px 0px 0px #111111; }
        .btn-comic:hover.shadow-black { box-shadow: 2px 2px 0px 0px #111111; }

        /* Animaciones para los Globos */
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-60vh) rotate(5deg); }
            100% { transform: translateY(-120vh) rotate(-5deg); }
        }
        @keyframes wiggle {
            0%, 100% { transform: rotate(-8deg); }
            50% { transform: rotate(8deg); }
        }
        .animate-wiggle {
            animation: wiggle 3s ease-in-out infinite;
        }
        .animate-wiggle-reverse {
            animation: wiggle 3s ease-in-out infinite reverse;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative">

    <!-- Globos Flotantes de Fondo -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <!-- Globo 1 -->
        <div class="absolute bottom-[-100px] left-[10%]" style="animation: floatUp 14s linear infinite 0s;">
            <svg viewBox="0 0 24 32" class="w-12 h-16 text-brandRed opacity-60" fill="currentColor">
                <path stroke="none" d="M12 2 C7 2 4 6 4 10 C4 14.5 9 19 12 20 C15 19 20 14.5 20 10 C20 6 17 2 12 2 Z"/>
                <path stroke="none" d="M11 20 h2 l1 2 h-4 z"/>
                <path fill="none" stroke="currentColor" stroke-width="1.5" d="M12 22 Q10 26 12 28 Q14 30 12 32"/>
            </svg>
        </div>
        <!-- Globo 2 -->
        <div class="absolute bottom-[-100px] left-[30%]" style="animation: floatUp 18s linear infinite 3s;">

        <!-- Globo 4 -->
        <div class="absolute bottom-[-100px] left-[75%]" style="animation: floatUp 17s linear infinite 5s;">

                <path stroke="none" d="M12 2 C7 2 4 6 4 10 C4 14.5 9 19 12 20 C15 19 20 14.5 20 10 C20 6 17 2 12 2 Z"/>
                <path stroke="none" d="M11 20 h2 l1 2 h-4 z"/>
                <path fill="none" stroke="currentColor" stroke-width="1.5" d="M12 22 Q10 26 12 28 Q14 30 12 32"/>

        <!-- Globo 5 -->

                <path fill="none" stroke="currentColor" stroke-width="1.5" d="M12 22 Q10 26 12 28 Q14 30 12 32"/>
            </svg>
        </div>
        <!-- Globo 6 -->
        <div class="absolute bottom-[-100px] left-[18%]" style="animation: floatUp 16s linear infinite 6s;">
            <svg viewBox="0 0 24 32" class="w-16 h-20 text-brandYellow opacity-60" fill="currentColor">
                <path stroke="none" d="M12 2 C7 2 4 6 4 10 C4 14.5 9 19 12 20 C15 19 20 14.5 20 10 C20 6 17 2 12 2 Z"/>

                <path fill="none" stroke="currentColor" stroke-width="1.5" d="M12 22 Q10 26 12 28 Q14 30 12 32"/>
            </svg>
        </div>
    </div>

            <!-- 2. WhatsApp -->
            <a href="https://wa.me/573014501072" target="_blank" rel="noopener noreferrer" class="btn-comic shadow-green border-4 border-brandGreen bg-white text-brandGreen font-bold rounded-2xl py-3 px-6 flex items-center justify-between group">
                <div class="flex items-center gap-4 text-xl">
                    <i class="fa-brands fa-whatsapp text-3xl group-hover:scale-110 transition-transform"></i>
                    <span>WhatsApp</span>

            <!-- 3. Instagram -->

                <div class="flex items-center gap-4 text-xl">
